name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format (informational, non-blocking)
        # Existing code predates ruff-format; report diffs but don't fail CI
        # until a one-shot format commit lands.
        continue-on-error: true
        run: ruff format --check --diff .

  typecheck:
    name: typecheck (mypy on public API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + mypy
        run: |
          pip install -e .
          pip install "mypy>=1.10"
      - name: Mypy (informational, non-blocking)
        # Public surface only; the implementation modules have a long tail of
        # untyped third-party calls (pyranges, statsmodels) that we don't want
        # to block CI on yet. Flip ``continue-on-error`` off once the public
        # API is fully annotated.
        continue-on-error: true
        run: |
          mypy --follow-imports=silent --ignore-missing-imports \
               --no-strict-optional \
               src/epykit/__init__.py src/epykit/methyldata.py src/epykit/tl.py

  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package (dev extras)
        run: |
          pip install -e ".[dev]"
      - name: Run tests (skip slow)
        run: pytest -m "not slow" -ra

  build:
    name: build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: Install built wheel and import
        run: |
          pip install dist/*.whl
          python -c "import epykit; print('epykit version:', epykit.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
