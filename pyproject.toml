[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epykit"
version = "0.1.0"
description = "Parquet-backed WGBS methylation analysis pipeline (Bismark → DMC/DMR → annotation)"
authors = [ { name = "epykit user" } ]
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "polars>=0.20.0",
  "pyarrow>=11.0.0",
  "numpy",
  "scipy",
  "numba",
  "pyranges",
  "pyfaidx",
  "statsmodels",
  "patsy>=0.5",
  "psutil>=7.2.2",
  "matplotlib>=3.9.4",
  "seaborn>=0.13.2",
  "scikit-learn>=1.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "pytest-cov",
]

[project.scripts]
epykit = "epykit.cli:main"

[tool.setuptools.package-data]
epykit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than ~5s; deselect with -m 'not slow'",
]
filterwarnings = [
    # Allow our own DeprecationWarnings through so tests can assert on them
    "default::DeprecationWarning:epykit",
    "default::UserWarning:epykit",
    # Silence third-party deprecation noise that flooded test output
    "ignore::DeprecationWarning:pyarrow",
    "ignore::DeprecationWarning:pyranges",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "scratch2.py",
    "**/.claude/**",
    "raw_data",
]

[tool.ruff.lint]
# Start minimal: pyflakes (undefined names, unused imports) only. Once the
# baseline is green in CI, ratchet up to ["F", "E", "W", "I", "B", "UP", "RUF"]
# and add a one-shot autofix commit.
select = ["F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]
"src/epykit/__init__.py" = ["F401"]  # re-exports
"src/epykit/pl/__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.isort]
known-first-party = ["epykit"]

[tool.mypy]
python_version = "3.9"
follow_imports = "silent"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = true
