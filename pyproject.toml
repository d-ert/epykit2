[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epykit"
version = "0.1.0"
description = "Parquet-backed WGBS methylation analysis pipeline (Bismark → DMC/DMR → annotation)"
authors = [ { name = "epykit user" } ]
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "polars>=0.20.0",
  "pyarrow>=11.0.0",
  "numpy",
  "scipy",
  "numba",
  "pyranges",
  "pyfaidx",
  "statsmodels",
  "patsy>=0.5",
  "psutil>=7.2.2",
  "matplotlib>=3.9.4",
  "seaborn>=0.13.2",
  "scikit-learn>=1.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "pytest-cov",
]

[project.scripts]
epykit = "epykit.cli:main"

[tool.setuptools.package-data]
epykit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than ~5s; deselect with -m 'not slow'",
]
filterwarnings = [
    # Allow our own DeprecationWarnings through so tests can assert on them
    "default::DeprecationWarning:epykit",
    "default::UserWarning:epykit",
    # Silence third-party deprecation noise that flooded test output
    "ignore::DeprecationWarning:pyarrow",
    "ignore::DeprecationWarning:pyranges",
]
